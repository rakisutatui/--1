const $=s=>document.querySelector(s);
const ls=(k,d)=>{try{return JSON.parse(localStorage[k])}catch{return d}},sv=(k,v)=>{try{localStorage[k]=JSON.stringify(v)}catch{}};
const ALL={};for(const g in RAW){let f='';ALL[g]=RAW[g].trim().split('\n').flatMap(l=>{if(l[0]=='#'){f=l.slice(1);return[]}const[t,m]=l.split('|');return[{id:g+':'+t,t,m,f}]})}
const shuf=a=>{a=[...a];for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let S={g:ls('g',1),mode:'card',f:'',flt:'all',i:0,open:false,sh:false,q:'',d:[],qz:null},K=new Set(ls('K',[])),W=new Set(ls('W',[]));
const save=()=>{sv('K',[...K]);sv('W',[...W])};
function deck(){S.d=ALL[S.g].filter(w=>(!S.f||w.f==S.f)&&(S.flt=='all'||(S.flt=='todo'&&!K.has(w.id))||(S.flt=='weak'&&W.has(w.id))));if(S.sh)S.d=shuf(S.d);S.i=0;S.open=false;S.qz=null}
function sg(g){S.g=g;S.f='';sv('g',g);deck();R()}
function mark(w,ok){if(ok){K.add(w.id);W.delete(w.id)}else{W.add(w.id);K.delete(w.id)}save()}
function ctl(){const fs=[...new Set(ALL[S.g].map(w=>w.f))];
return `<div class="row">${[1,2,3].map(g=>`<button class="g ${g==S.g?'on':''}" onclick="sg(${g})">中${g}</button>`).join('')}</div>
<div class="row"><select aria-label="分野" onchange="S.f=this.value;deck();R()"><option value="">全分野${fs.map(x=>`<option ${x==S.f?'selected':''}>${x}`).join('')}</select>
<select aria-label="絞り込み" onchange="S.flt=this.value;deck();R()">${[['all','すべて'],['todo','未習得'],['weak','苦手']].map(([v,n])=>`<option value="${v}" ${v==S.flt?'selected':''}>${n}`).join('')}</select>
<label><input type="checkbox" ${S.sh?'checked':''} onchange="S.sh=this.checked;deck();R()"> シャッフル</label></div>
<div class="row">${[['card','カード'],['quiz','クイズ'],['list','一覧'],['tool','⏱ ツール']].map(([v,n])=>`<button class="${v==S.mode?'on':''}" onclick="S.mode='${v}';${v=='quiz'?'S.qz=null;':''}R()">${n}</button>`).join('')}</div>`}
const empty='<div class="card">該当する単語がありません。絞り込みを変えてください。</div>';
function vCard(){const d=S.d;if(!d.length)return empty;const w=d[S.i];
return `<button class="card face" onclick="S.open=!S.open;R()"><small>${w.f}　${S.i+1}/${d.length}</small><div class="t">${w.t}</div>${S.open?`<div class="m">${w.m}</div>`:'<div class="sub">タップで意味を表示</div>'}</button>
<div class="row"><button onclick="mv(-1)">←前</button><button class="ok" onclick="mk(1)">覚えた</button><button class="ng" onclick="mk(0)">まだ</button><button onclick="mv(1)">次→</button></div>`}
function mv(n){const l=S.d.length;S.i=(S.i+n+l)%l;S.open=false;R()}
function mk(ok){mark(S.d[S.i],ok);mv(1)}
function nq(){const z=S.qz,w=z.d[z.i];if(w)z.c=shuf([w,...shuf(ALL[S.g].filter(x=>x!=w)).slice(0,3)])}
function vQuiz(){if(!S.d.length)return empty;
if(!S.qz){S.qz={d:shuf(S.d).slice(0,20),i:0,ok:0,p:null};nq()}
const z=S.qz;if(z.i>=z.d.length)return `<div class="card"><div class="t">結果 ${z.ok} / ${z.d.length}</div><p class="sub">まちがえた単語は「苦手」に入りました。</p><button class="on" onclick="S.qz=null;R()">もう一度</button></div>`;
const w=z.d[z.i];
return `<div class="card"><small>${z.i+1}/${z.d.length}　正解 ${z.ok}　（意味にあてはまる用語は？）</small><div class="m">${w.m}</div></div>${z.c.map((c,k)=>`<button class="ch ${z.p==null?'':c==w?'ok':k==z.p?'ng':''}" onclick="ans(${k})">${c.t}</button>`).join('')}${z.p!=null?'<button class="on ch" onclick="nx()">次へ</button>':''}`}
function ans(k){const z=S.qz;if(z.p!=null)return;z.p=k;const w=z.d[z.i];if(z.c[k]==w)z.ok++;mark(w,z.c[k]==w);R()}
function nx(){S.qz.i++;S.qz.p=null;nq();R()}
function vList(){return `<input id="q" placeholder="用語・意味で検索" value="${S.q}" oninput="S.q=this.value;L()"><div id="lst"></div>`}
function L(){const q=S.q.trim();$('#lst').innerHTML=S.d.filter(w=>!q||w.t.includes(q)||w.m.includes(q)).map(w=>`<div class="card item"><div><b>${K.has(w.id)?'✓ ':''}${w.t}</b> <small>${w.f}</small><br>${w.m}</div><button aria-label="苦手に追加" data-i="${w.id}" onclick="tg(this.dataset.i)">${W.has(w.id)?'★':'☆'}</button></div>`).join('')||empty}
function tg(id){W.has(id)?W.delete(id):(W.add(id),K.delete(id));save();L()}
function R(){$('#ctl').innerHTML=ctl();const k=ALL[S.g].filter(w=>K.has(w.id)).length;$('#pg').textContent=`覚えた ${k}/${ALL[S.g].length}`;$('#tool').hidden=S.mode!='tool';
$('#app').innerHTML=S.mode=='card'?vCard():S.mode=='quiz'?vQuiz():S.mode=='list'?vList():'';if(S.mode=='list')L()}
onkeydown=e=>{if(S.mode!='card'||!S.d.length||/INPUT|SELECT/.test(e.target.tagName))return;if(e.key=='ArrowRight')mv(1);if(e.key=='ArrowLeft')mv(-1);if(e.key==' '){e.preventDefault();S.open=!S.open;R()}};

// タイマー
const f2=s=>String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
let tl=600,tI=null,tEnd=0;
const tmin=()=>Math.max(1,+$('#tm').value||10)*60;
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.8)}catch{}navigator.vibrate&&navigator.vibrate(400)}
function sT(m){$('#tm').value=m;rsT()}
function rsT(){clearInterval(tI);tI=null;tl=tmin();$('#tt').textContent=f2(tl);$('#tb').textContent='開始'}
function tgT(){if(tI){clearInterval(tI);tI=null;tl=Math.ceil((tEnd-Date.now())/1000);$('#tb').textContent='再開';return}
tEnd=Date.now()+tl*1000;$('#tb').textContent='一時停止';
tI=setInterval(()=>{const r=Math.ceil((tEnd-Date.now())/1000);$('#tt').textContent=f2(Math.max(r,0));if(r<=0){clearInterval(tI);tI=null;tl=tmin();$('#tb').textContent='開始';beep()}},250)}
// ストップウォッチ
let sI=null,s0=0,sa=0,lp=[];
const cur=()=>sa+(sI?Date.now()-s0:0),fs=ms=>f2(ms/1000|0)+'.'+(ms/100%10|0);
function tgS(){if(sI){clearInterval(sI);sI=null;sa+=Date.now()-s0;$('#sb').textContent='再開'}else{s0=Date.now();$('#sb').textContent='停止';sI=setInterval(()=>$('#sw').textContent=fs(cur()),50)}}
function lap(){if(!cur())return;lp.push(fs(cur()));$('#laps').innerHTML=lp.map(x=>`<li>${x}</li>`).join('')}
function rsS(){clearInterval(sI);sI=null;sa=0;lp=[];$('#sw').textContent='00:00.0';$('#sb').textContent='開始';$('#laps').innerHTML=''}
deck();R();rsT();
</script></body></html>
